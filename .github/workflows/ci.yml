name: CI

# Runs the test suite on every push and pull request. This is the fast,
# early-feedback gate; the deploy workflow also runs tests before rebuilding
# production (defence in depth), but this job catches regressions before a
# change ever reaches main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check (fast gate)
        run: |
          set -euo pipefail
          # node --check every first-party .js file (server, public, test).
          find server public test -name '*.js' -print0 \
            | xargs -0 -n1 node --check

      - name: Run tests
        run: npm test
