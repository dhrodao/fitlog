name: CI

# Runs the test suite on every push and pull request. This is the early-feedback
# gate; the deploy workflow also runs tests before rebuilding production (defence
# in depth), but this job catches regressions before a change reaches main.
#
# It runs on the same self-hosted runner as the deploy (this repo has no hosted
# GitHub runners: the app lives behind a Cloudflare Tunnel on a single machine).
# Because that host does not necessarily have Node/npm installed (the app runs
# in Docker), the suite is executed inside an ephemeral Node container, so CI
# depends only on Docker — exactly like the deploy's test gate.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Avoid two CI runs racing for the single self-hosted runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run syntax check and tests
        run: |
          set -euo pipefail
          # Run in an ephemeral Node container (Docker is the only host
          # dependency). The workspace is mounted READ-ONLY and copied to a
          # path inside the container before installing, so npm never writes
          # node_modules back into the runner workspace — otherwise the next
          # checkout can't clean it (EACCES). We also run as the runner's own
          # UID/GID (belt and braces) and point HOME/npm cache at the writable
          # copy, so nothing root-owned is ever produced.
          #
          # --network=host: this host's Docker bridge network has NO Internet
          # (same reason the image build uses --network=host), so without it
          # npm and the prebuild download cannot reach the network at all.
          #
          # better-sqlite3 is a native addon. On this slim image prebuild-install
          # cannot auto-detect the libc (it reports an empty value) and so fails
          # to match its prebuilt binary, then falls back to node-gyp, which
          # needs a compiler the image does not ship. We therefore install with
          # --ignore-scripts and fetch the prebuilt binary explicitly with
          # `prebuild-install --libc glibc`, so nothing is compiled.
          # prebuild-install downloads from GitHub releases; GitHub occasionally
          # answers 5xx/times out from this host, and prebuild-install neither
          # retries nor errors clearly (it masks a failed download as "No
          # prebuilt binaries found"), so we fall back to the npmmirror mirror.
          docker run --rm \
            --network=host \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e npm_config_cache=/tmp/.npm \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            node:20-bookworm-slim \
            sh -eu -c '
              cp -r /src /tmp/build
              cd /tmp/build
              rm -rf node_modules
              find server public test -name "*.js" -print0 | xargs -0 -n1 node --check
              npm ci --ignore-scripts
              cd node_modules/better-sqlite3
              mirror="https://registry.npmmirror.com/-/binary/better-sqlite3/v{version}/{name}-v{version}-{runtime}-v{abi}-{platform}{libc}-{arch}.tar.gz"
              ../.bin/prebuild-install --runtime node --libc glibc \
                || ../.bin/prebuild-install --runtime node --libc glibc --download "$mirror"
              cd /tmp/build
              npm test
            '
