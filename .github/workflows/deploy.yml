name: Deploy to production

# Redeploys the production stack whenever main is updated. Runs on a
# self-hosted runner installed on the production machine (the app lives behind
# a Cloudflare Tunnel with no inbound ports, so the deploy must be pull-based:
# the runner on that host fetches the new code and rebuilds the container).
#
# The deploy operates on the existing production checkout at PROD_DIR, which
# already holds the real .env and the ./data bind mount (the SQLite database).
# We intentionally do NOT use the runner's own checkout so the database and
# configuration are never replaced.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never run two deploys at once.
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  PROD_DIR: /opt/fitlog

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Update production checkout
        run: |
          set -euo pipefail
          cd "$PROD_DIR"
          git fetch --prune origin
          git checkout main
          git reset --hard origin/main

      - name: Run tests (gate the deploy)
        run: |
          set -euo pipefail
          cd "$PROD_DIR"
          # Run the suite in an ephemeral Node container so we depend only on
          # Docker (already required on this host), never on a host Node install
          # or the production node_modules. The checkout is mounted READ-ONLY
          # and copied inside the container before installing; we also run as
          # the runner's UID/GID with a writable HOME/npm cache, so npm never
          # writes root-owned files into /opt/fitlog. Tests use a throwaway
          # SQLite DB in the container, so the ./data bind mount is untouched.
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e npm_config_cache=/tmp/.npm \
            -v "$PROD_DIR:/src:ro" \
            node:20-bookworm-slim \
            sh -eu -c '
              cp -r /src /tmp/build
              cd /tmp/build
              rm -rf node_modules
              npm ci
              npm test
            '

      - name: Back up and migrate the database
        run: |
          set -euo pipefail
          cd "$PROD_DIR"
          # Apply pending schema migrations BEFORE recreating the container, so
          # the schema change is separated from serving traffic and a failed
          # migration stops the deploy while the old container keeps running.
          # A consistent backup is taken immediately before migrating.
          #
          # Runs in an ephemeral Node container (same pattern as the test gate):
          # the checkout is mounted read-only and copied in, but ./data and
          # ./backups are mounted read-write so the backup and the migration act
          # on the REAL production database. We force a non-production NODE_ENV
          # here: migrations only touch the schema and need no secrets, and this
          # avoids the production boot guard (SESSION_SECRET / allowlist). DB_PATH
          # and BACKUP_DIR point at the mounted volumes.
          mkdir -p "$PROD_DIR/data" "$PROD_DIR/backups"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e npm_config_cache=/tmp/.npm \
            -e NODE_ENV=development \
            -e DB_PATH=/data/fitness.db \
            -e BACKUP_DIR=/backups \
            -v "$PROD_DIR:/src:ro" \
            -v "$PROD_DIR/data:/data" \
            -v "$PROD_DIR/backups:/backups" \
            node:20-bookworm-slim \
            sh -eu -c '
              cp -r /src /tmp/build
              cd /tmp/build
              rm -rf node_modules
              npm ci
              npm run backup:db
              npm run migrate
            '

      - name: Build and (re)start the stack
        run: |
          set -euo pipefail
          cd "$PROD_DIR"
          # Rebuild only the app image and recreate the container. The
          # cloudflared service and the ./data bind mount are left untouched.
          docker compose up -d --build app

      - name: Wait for the app to become healthy
        run: |
          set -euo pipefail
          cd "$PROD_DIR"
          PORT="$(grep -E '^PORT=' .env 2>/dev/null | cut -d= -f2)"
          PORT="${PORT:-3000}"
          url="http://127.0.0.1:${PORT}/api/health"
          echo "Probing ${url} ..."
          for i in $(seq 1 30); do
            if curl -fsS --max-time 3 "$url" >/dev/null 2>&1; then
              echo "App is healthy."
              exit 0
            fi
            echo "  attempt ${i}/30 not ready yet; retrying in 2s"
            sleep 2
          done
          echo "::error::App did not become healthy in time; dumping recent logs" >&2
          docker compose logs --tail 60 app >&2 || true
          exit 1
