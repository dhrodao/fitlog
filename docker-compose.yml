services:
  app:
    build:
      context: .
      # Docker's bridge network has no Internet access on this host, so the
      # build (npm ci) uses the host network to be able to download packages.
      network: host
    # Image tag is parameterised so the deploy can build and run a specific
    # per-commit tag (e.g. fitness-app:<sha>) and roll back to the previous tag
    # if the new one is unhealthy. Defaults to the plain tag for local use.
    image: ${APP_IMAGE:-fitness-app:local}
    container_name: fitness-app
    restart: unless-stopped

    # Environment variables from .env (GOOGLE_CLIENT_ID, SESSION_SECRET, etc.).
    # Copy .env.example to .env before starting.
    env_file:
      - .env

    # Docker's bridge network has no Internet access on this host. With
    # network_mode: host the container uses the host network, so:
    #  - the exercise catalog can be synced, and
    #  - the app is reachable on the .env PORT (e.g. http://localhost:3000)
    #    without mapping ports (the `ports` block does not apply with host).
    # If your bridge network does have Internet, you can drop this line and
    # uncomment the `ports` block below.
    network_mode: host

    # ports:
    #   - "${PORT:-3000}:${PORT:-3000}"

    # Persist the SQLite database on the host via a bind mount.
    # ./data on the host is mounted at /app/data in the container, so the
    # DB_PATH (data/fitness.db) lives in the project's ./data directory and
    # is directly visible/backup-able from the host. The container runs as the
    # non-root `node` user (UID/GID 1000); on single-user Linux hosts that
    # matches the host user, so SQLite can write without extra tweaks.
    volumes:
      - ./data:/app/data

    # Health check against the app endpoint.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
